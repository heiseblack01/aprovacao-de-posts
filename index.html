<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprovação de Posts</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-text-primary: #111827;
      --color-text-secondary: #4b5563;
      --color-text-tertiary: #9ca3af;
      --color-text-inverse: #ffffff;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f9fafb;
      --color-background-tertiary: #f3f4f6;
      --color-border-primary: #d1d5db;
      --color-border-secondary: #e5e7eb;
      --color-border-tertiary: #f3f4f6;
      --color-accent-primary: #2563eb;
      --color-accent-success: #16a34a;
      --color-accent-danger: #dc2626;
      --color-status-pending-bg: #fef9c3;
      --color-status-pending-text: #854d0e;
      --color-status-approved-bg: #dcfce7;
      --color-status-approved-text: #166534;
      --color-status-revision-bg: #fee2e2;
      --color-status-revision-text: #991b1b;
      --border-radius-sm: 4px;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
      --border-radius-xl: 16px;
      --border-radius-full: 9999px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-background-secondary);
      color: var(--color-text-primary);
      line-height: 1.5;
      min-height: 100vh;
    }

    #root { min-height: 100vh; }

    .carousel-track {
      display: flex;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Supabase ─────────────────────────────────────────────────────────────────

    const sb = supabase.createClient(
      'https://rtlodjiyjrkkqnaykieb.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bG9kaml5anJra3FuYXlraWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMDgxOTIsImV4cCI6MjA5MTc4NDE5Mn0.hPXGO3PjVM5JJdUyxzgKmqa0GewezmCQB_yYvftRpO0'
    );

    function mapRow(r) {
      const urls = Array.isArray(r.creative_urls) && r.creative_urls.length > 0
        ? r.creative_urls
        : r.creative_url ? [r.creative_url] : [];
      return {
        id:            r.id,
        title:         r.title,
        creativeUrls:  urls,
        caption:       r.caption,
        observation:   r.observation    || '',
        status:        r.status,
        clientComment: r.client_comment || null,
        createdAt:     r.created_at,
      };
    }

    async function loadPosts() {
      const { data, error } = await sb
        .from('posts').select('*').order('created_at', { ascending: false });
      if (error) { console.error(error); return []; }
      return (data || []).map(mapRow);
    }

    async function loadPost(id) {
      const { data, error } = await sb
        .from('posts').select('*').eq('id', id).maybeSingle();
      if (error || !data) return null;
      return mapRow(data);
    }

    function withTimeout(promise, ms, msg) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(msg)), ms)),
      ]);
    }

    async function uploadImages(files) {
      // Verifica se o bucket existe antes de tentar subir
      const { error: bucketErr } = await withTimeout(
        sb.storage.from('criativos').list('', { limit: 1 }),
        8000,
        'Bucket "criativos" não encontrado ou inacessível. Crie o bucket no Supabase Storage e configure as políticas de acesso.'
      );
      if (bucketErr) {
        console.error('Erro bucket:', bucketErr);
        throw new Error(`Bucket inacessível: ${bucketErr.message}. Verifique se o bucket "criativos" existe e as políticas estão configuradas.`);
      }

      const urls = await Promise.all(files.map(async (file) => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${uid()}.${ext}`;
        const { error } = await withTimeout(
          sb.storage.from('criativos').upload(path, file, { cacheControl: '3600' }),
          30000,
          `Timeout ao enviar "${file.name}". Verifique sua conexão.`
        );
        if (error) {
          console.error('Erro no upload:', error);
          throw new Error(`Erro ao enviar "${file.name}": ${error.message}`);
        }
        return sb.storage.from('criativos').getPublicUrl(path).data.publicUrl;
      }));
      return urls;
    }

    async function createPost(post) {
      const { error } = await sb.from('posts').insert({
        id:            post.id,
        title:         post.title,
        creative_urls: post.creativeUrls || [],
        caption:       post.caption,
        observation:   post.observation  || null,
        status:        'aguardando',
      });
      if (error) throw error;
    }

    async function deletePost(id) {
      const { error } = await sb.from('posts').delete().eq('id', id);
      if (error) throw error;
    }

    async function updatePostStatus(id, status, clientComment) {
      const { error } = await sb.from('posts').update({
        status,
        client_comment: clientComment || null,
      }).eq('id', id);
      if (error) throw error;
    }

    // ─── Utils ───────────────────────────────────────────────────────────────────

    function uid() {
      return Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
    }

    function reviewUrl(id) {
      return `${window.location.href.split('#')[0]}#review/${id}`;
    }

    function copyText(text) {
      if (navigator.clipboard) return navigator.clipboard.writeText(text).catch(() => fbCopy(text));
      fbCopy(text);
      function fbCopy(t) {
        const el = document.createElement('textarea');
        el.value = t; document.body.appendChild(el); el.select();
        document.execCommand('copy'); document.body.removeChild(el);
      }
    }

    // ─── Shared styles ───────────────────────────────────────────────────────────

    const S = {
      input: {
        width: '100%', padding: '10px 12px', fontSize: '0.875rem',
        border: '1px solid var(--color-border-primary)',
        borderRadius: 'var(--border-radius-md)',
        background: 'var(--color-background-primary)',
        color: 'var(--color-text-primary)',
        fontFamily: 'inherit', outline: 'none',
      },
      btn: (bg, color, border) => ({
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        padding: '10px 18px', fontSize: '0.875rem', fontWeight: 600,
        background: bg, color, border: border ? `1px solid ${border}` : 'none',
        borderRadius: 'var(--border-radius-md)', cursor: 'pointer',
        fontFamily: 'inherit', whiteSpace: 'nowrap',
      }),
      smallBtn: (color, border) => ({
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        padding: '5px 12px', fontSize: '0.75rem', fontWeight: 500,
        background: 'transparent', color, border: `1px solid ${border || 'var(--color-border-primary)'}`,
        borderRadius: 'var(--border-radius-md)', cursor: 'pointer',
        fontFamily: 'inherit', whiteSpace: 'nowrap',
      }),
    };

    const btnPrimary   = S.btn('var(--color-accent-primary)', 'var(--color-text-inverse)');
    const btnSuccess   = S.btn('var(--color-accent-success)', 'var(--color-text-inverse)');
    const btnSecondary = S.btn('transparent', 'var(--color-text-primary)', 'var(--color-border-primary)');
    const smallBtn     = S.smallBtn('var(--color-text-secondary)');
    const smallBtnBack = S.smallBtn('var(--color-text-primary)', 'var(--color-border-primary)');

    // ─── StatusBadge ─────────────────────────────────────────────────────────────

    const STATUS = {
      aguardando: { label: 'Aguardando', bg: 'var(--color-status-pending-bg)',  color: 'var(--color-status-pending-text)'  },
      aprovado:   { label: 'Aprovado',   bg: 'var(--color-status-approved-bg)', color: 'var(--color-status-approved-text)' },
      em_revisao: { label: 'Em revisão', bg: 'var(--color-status-revision-bg)', color: 'var(--color-status-revision-text)' },
    };

    function StatusBadge({ status }) {
      const { label, bg, color } = STATUS[status] || STATUS.aguardando;
      return (
        <span style={{
          display: 'inline-flex', alignItems: 'center',
          padding: '2px 10px', borderRadius: 'var(--border-radius-full)',
          fontSize: '0.75rem', fontWeight: 600,
          backgroundColor: bg, color,
        }}>
          {label}
        </span>
      );
    }

    // ─── ImageUpload ─────────────────────────────────────────────────────────────

    function ImageUpload({ images, onChange }) {
      const inputRef = useRef(null);

      const handleAdd = (e) => {
        const files = Array.from(e.target.files);
        const newItems = files.map(f => ({
          id: uid(),
          file: f,
          preview: URL.createObjectURL(f),
        }));
        onChange([...images, ...newItems]);
        e.target.value = '';
      };

      const remove = (id) => onChange(images.filter(img => img.id !== id));

      return (
        <div>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(3, 1fr)',
            gap: '0.5rem',
          }}>
            {images.map((img, i) => (
              <div key={img.id} style={{
                position: 'relative',
                aspectRatio: '1',
                borderRadius: 'var(--border-radius-md)',
                overflow: 'hidden',
                border: '1px solid var(--color-border-secondary)',
                background: '#000',
              }}>
                <img
                  src={img.preview}
                  style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                />
                {/* Position number */}
                <div style={{
                  position: 'absolute', top: 5, left: 6,
                  background: 'rgba(0,0,0,0.55)', color: '#fff',
                  borderRadius: 5, padding: '1px 6px',
                  fontSize: '0.7rem', fontWeight: 700, lineHeight: 1.6,
                }}>
                  {i + 1}
                </div>
                {/* Remove button */}
                <button
                  type="button"
                  onClick={() => remove(img.id)}
                  style={{
                    position: 'absolute', top: 4, right: 4,
                    width: 22, height: 22, borderRadius: '50%',
                    background: 'rgba(0,0,0,0.65)', border: 'none',
                    color: '#fff', cursor: 'pointer',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 15, lineHeight: 1, padding: 0, fontWeight: 400,
                  }}
                >
                  ×
                </button>
              </div>
            ))}

            {/* Add button */}
            <button
              type="button"
              onClick={() => inputRef.current?.click()}
              style={{
                aspectRatio: '1',
                border: '2px dashed var(--color-border-primary)',
                borderRadius: 'var(--border-radius-md)',
                background: 'transparent', cursor: 'pointer',
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                gap: '0.25rem',
                color: 'var(--color-text-tertiary)',
                fontFamily: 'inherit',
              }}
            >
              <span style={{ fontSize: 26, lineHeight: 1 }}>+</span>
              <span style={{ fontSize: '0.7rem' }}>Adicionar</span>
            </button>
          </div>

          {images.length > 0 && (
            <p style={{ fontSize: '0.75rem', color: 'var(--color-text-tertiary)', marginTop: '0.5rem' }}>
              {images.length} {images.length === 1 ? 'imagem selecionada' : 'imagens selecionadas'}
              {images.length > 1 && ' — carrossel'}
            </p>
          )}

          <input
            ref={inputRef}
            type="file"
            accept="image/*"
            multiple
            onChange={handleAdd}
            style={{ display: 'none' }}
          />
        </div>
      );
    }

    // ─── Carousel ────────────────────────────────────────────────────────────────

    function Carousel({ urls }) {
      const [idx, setIdx]       = useState(0);
      const touchStartX         = useRef(null);
      const total               = urls ? urls.length : 0;

      if (!total) return null;

      const go    = (n) => setIdx(Math.max(0, Math.min(total - 1, n)));
      const prev  = (e) => { e.stopPropagation(); go(idx - 1); };
      const next  = (e) => { e.stopPropagation(); go(idx + 1); };

      const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const onTouchEnd   = (e) => {
        if (touchStartX.current === null) return;
        const diff = touchStartX.current - e.changedTouches[0].clientX;
        if (diff > 40)  go(idx + 1);
        if (diff < -40) go(idx - 1);
        touchStartX.current = null;
      };

      return (
        <div
          style={{ position: 'relative', background: '#000', userSelect: 'none', overflow: 'hidden' }}
          onTouchStart={onTouchStart}
          onTouchEnd={onTouchEnd}
        >
          {/* Aspect ratio box — mantém proporção 1:1 */}
          <div style={{ paddingBottom: '100%' }} />

          {/* Track — posicionado sobre o aspect ratio box */}
          <div
            className="carousel-track"
            style={{
              position: 'absolute', top: 0, left: 0,
              width: '100%', height: '100%',
              transform: `translateX(${-idx * 100}%)`,
            }}
          >
            {urls.map((url, i) => (
              <div key={i} style={{ minWidth: '100%', height: '100%', flexShrink: 0 }}>
                <img
                  src={url}
                  alt={`Imagem ${i + 1}`}
                  style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block' }}
                  onError={e => { e.target.style.opacity = '0'; }}
                />
              </div>
            ))}
          </div>

          {/* Counter */}
          {total > 1 && (
            <div style={{
              position: 'absolute', top: 10, right: 12,
              background: 'rgba(0,0,0,0.52)', color: '#fff',
              borderRadius: 20, padding: '3px 9px',
              fontSize: '0.75rem', fontWeight: 600, letterSpacing: '0.02em',
            }}>
              {idx + 1}/{total}
            </div>
          )}

          {/* Left arrow */}
          {total > 1 && idx > 0 && (
            <button onClick={prev} style={{
              position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)',
              width: 34, height: 34, borderRadius: '50%',
              background: 'rgba(255,255,255,0.88)', border: 'none',
              cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 20, fontWeight: 700, color: '#111', zIndex: 2, lineHeight: 1,
            }}>
              ‹
            </button>
          )}

          {/* Right arrow */}
          {total > 1 && idx < total - 1 && (
            <button onClick={next} style={{
              position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)',
              width: 34, height: 34, borderRadius: '50%',
              background: 'rgba(255,255,255,0.88)', border: 'none',
              cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 20, fontWeight: 700, color: '#111', zIndex: 2, lineHeight: 1,
            }}>
              ›
            </button>
          )}

          {/* Dots */}
          {total > 1 && (
            <div style={{
              position: 'absolute', bottom: 10, left: 0, right: 0,
              display: 'flex', justifyContent: 'center', gap: 5,
            }}>
              {urls.map((_, i) => (
                <div
                  key={i}
                  onClick={(e) => { e.stopPropagation(); go(i); }}
                  style={{
                    width: i === idx ? 18 : 6, height: 6,
                    borderRadius: 3,
                    background: i === idx ? '#fff' : 'rgba(255,255,255,0.45)',
                    cursor: 'pointer',
                    transition: 'width 0.2s ease, background 0.2s ease',
                  }}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── SummaryCards ────────────────────────────────────────────────────────────

    function SummaryCards({ posts }) {
      const counts = posts.reduce((a, p) => ({ ...a, [p.status]: (a[p.status] || 0) + 1 }), {});
      const cards = [
        { label: 'Total',      n: posts.length,            color: 'var(--color-text-primary)'        },
        { label: 'Aguardando', n: counts.aguardando || 0,  color: 'var(--color-status-pending-text)' },
        { label: 'Aprovados',  n: counts.aprovado   || 0,  color: 'var(--color-accent-success)'      },
        { label: 'Em revisão', n: counts.em_revisao || 0,  color: 'var(--color-accent-danger)'       },
      ];
      return (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '1rem', marginBottom: '1.5rem' }}>
          {cards.map(c => (
            <div key={c.label} style={{
              background: 'var(--color-background-primary)',
              border: '1px solid var(--color-border-secondary)',
              borderRadius: 'var(--border-radius-lg)', padding: '1.25rem',
            }}>
              <div style={{ fontSize: '0.8125rem', color: 'var(--color-text-secondary)', marginBottom: '0.25rem' }}>{c.label}</div>
              <div style={{ fontSize: '1.875rem', fontWeight: 700, color: c.color, lineHeight: 1 }}>{c.n}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─── CreatePostForm ───────────────────────────────────────────────────────────

    function CreatePostForm({ onSave, onCancel }) {
      const [f, setF]           = useState({ title: '', caption: '', observation: '' });
      const [images, setImages] = useState([]);
      const [saving, setSaving] = useState(false);
      const [erro,   setErro]   = useState(null);
      const set = k => e => setF(p => ({ ...p, [k]: e.target.value }));

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!f.title.trim() || !f.caption.trim()) return;
        setSaving(true);
        setErro(null);
        try {
          await onSave({ ...f, images });
        } catch (err) {
          console.error(err);
          setErro(err.message || 'Erro desconhecido. Veja o console para detalhes.');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div style={{
          background: 'var(--color-background-primary)',
          border: '1px solid var(--color-border-secondary)',
          borderRadius: 'var(--border-radius-lg)', padding: '1.5rem', marginBottom: '1.5rem',
        }}>
          <h2 style={{ fontSize: '1.0625rem', fontWeight: 600, marginBottom: '1.25rem' }}>Novo post</h2>
          <form onSubmit={handleSubmit}>
            <div style={{ display: 'grid', gap: '1rem' }}>

              <Field label="Título interno *">
                <input type="text" value={f.title} onChange={set('title')}
                  placeholder="Ex: Post Instagram — Lançamento produto" style={S.input} required />
              </Field>

              <Field label="Imagens (opcional)">
                <ImageUpload images={images} onChange={setImages} />
              </Field>

              <Field label="Legenda *">
                <textarea value={f.caption} onChange={set('caption')}
                  placeholder="Texto que será publicado com o post…"
                  rows={4} style={{ ...S.input, resize: 'vertical' }} required />
              </Field>

              <Field label="Observação para o cliente (opcional)">
                <textarea value={f.observation} onChange={set('observation')}
                  placeholder="Informações adicionais, contexto, instruções…"
                  rows={3} style={{ ...S.input, resize: 'vertical' }} />
              </Field>

              {erro && (
                <div style={{
                  fontSize: '0.8125rem',
                  color: 'var(--color-accent-danger)',
                  background: 'var(--color-status-revision-bg)',
                  border: '1px solid #fca5a5',
                  borderRadius: 'var(--border-radius-md)',
                  padding: '0.625rem 0.875rem',
                }}>
                  <strong>Erro:</strong> {erro}
                </div>
              )}

              <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'flex-end', alignItems: 'center' }}>
                {saving && (
                  <span style={{ fontSize: '0.8125rem', color: 'var(--color-text-tertiary)' }}>
                    {images.length > 0 ? `Enviando ${images.length} imagem${images.length > 1 ? 'ns' : ''}…` : 'Salvando…'}
                  </span>
                )}
                <button type="button" onClick={onCancel} style={btnSecondary} disabled={saving}>Cancelar</button>
                <button type="submit" style={{ ...btnPrimary, opacity: saving ? 0.6 : 1 }} disabled={saving}>
                  Criar post
                </button>
              </div>

            </div>
          </form>
        </div>
      );
    }

    function Field({ label, children }) {
      return (
        <div>
          <label style={{ display: 'block', fontSize: '0.8125rem', fontWeight: 500, marginBottom: '0.375rem', color: 'var(--color-text-secondary)' }}>
            {label}
          </label>
          {children}
        </div>
      );
    }

    // ─── PostCard (Admin) ─────────────────────────────────────────────────────────

    function PostCard({ post, onDelete, onViewAsClient }) {
      const [copied, setCopied] = useState(false);
      const hasImages = post.creativeUrls && post.creativeUrls.length > 0;

      const handleCopy = () => {
        copyText(reviewUrl(post.id));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div style={{
          background: 'var(--color-background-primary)',
          border: '1px solid var(--color-border-secondary)',
          borderRadius: 'var(--border-radius-lg)',
          overflow: 'hidden',
          display: 'flex', flexDirection: 'column',
        }}>
          {/* Thumbnail strip */}
          {hasImages && (
            <div style={{ display: 'flex', height: 90, background: '#000' }}>
              {post.creativeUrls.slice(0, 4).map((url, i) => (
                <div key={i} style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
                  <img
                    src={url} alt=""
                    style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', opacity: i > 0 ? 0.6 : 1 }}
                  />
                  {i === 0 && post.creativeUrls.length > 1 && (
                    <div style={{
                      position: 'absolute', bottom: 5, right: 6,
                      background: 'rgba(0,0,0,0.6)', color: '#fff',
                      borderRadius: 6, padding: '1px 6px',
                      fontSize: '0.7rem', fontWeight: 700,
                    }}>
                      1/{post.creativeUrls.length}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          <div style={{ padding: '1rem', display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '1rem' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: '0.15rem' }}>
                  {post.title}
                </div>
                <div style={{ fontSize: '0.75rem', color: 'var(--color-text-tertiary)' }}>{fmtDate(post.createdAt)}</div>
              </div>
              <StatusBadge status={post.status} />
            </div>

            {post.caption && (
              <div style={{
                fontSize: '0.875rem', color: 'var(--color-text-secondary)',
                overflow: 'hidden', display: '-webkit-box',
                WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', textOverflow: 'ellipsis',
              }}>
                {post.caption}
              </div>
            )}

            {post.clientComment && (
              <div style={{
                fontSize: '0.8125rem',
                color: 'var(--color-status-revision-text)',
                background: 'var(--color-status-revision-bg)',
                borderRadius: 'var(--border-radius-md)', padding: '0.5rem 0.75rem',
              }}>
                <strong>Comentário do cliente:</strong> {post.clientComment}
              </div>
            )}

            <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
              <button onClick={handleCopy} style={smallBtn}>{copied ? 'Copiado!' : 'Copiar link'}</button>
              <button onClick={() => onViewAsClient(post)} style={smallBtn}>Ver como cliente</button>
              <button onClick={() => onDelete(post.id)}
                style={S.smallBtn('var(--color-accent-danger)', 'var(--color-accent-danger)')}>
                Excluir
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── AdminPanel ───────────────────────────────────────────────────────────────

    function AdminPanel({ posts, onRefresh }) {
      const [showForm, setShowForm] = useState(false);
      const [simPost,  setSimPost]  = useState(null);

      const handleSave = async (form) => {
        const creativeUrls = form.images.length > 0
          ? await uploadImages(form.images.map(img => img.file))
          : [];
        await createPost({ id: uid(), title: form.title, creativeUrls, caption: form.caption, observation: form.observation });
        await onRefresh();
        setShowForm(false);
      };

      const handleDelete = async (id) => {
        if (!confirm('Excluir este post?')) return;
        await deletePost(id);
        await onRefresh();
      };

      if (simPost) {
        return (
          <ClientView
            post={simPost} isSimulation
            onBack={() => setSimPost(null)}
            onActionDone={() => {}}
          />
        );
      }

      return (
        <div style={{ maxWidth: 820, margin: '0 auto', padding: '1.5rem' }}>

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
            <h1 style={{ fontSize: '1.5rem', fontWeight: 700 }}>Aprovação de Posts</h1>
            <button onClick={() => setShowForm(v => !v)} style={showForm ? btnSecondary : btnPrimary}>
              {showForm ? 'Cancelar' : '+ Novo post'}
            </button>
          </div>

          <SummaryCards posts={posts} />

          {showForm && <CreatePostForm onSave={handleSave} onCancel={() => setShowForm(false)} />}

          {posts.length === 0 ? (
            <div style={{
              textAlign: 'center', padding: '3.5rem 2rem',
              background: 'var(--color-background-primary)',
              border: '1px solid var(--color-border-secondary)',
              borderRadius: 'var(--border-radius-lg)',
              color: 'var(--color-text-tertiary)',
            }}>
              <div style={{ fontSize: '1.125rem', marginBottom: '0.4rem' }}>Nenhum post criado</div>
              <div style={{ fontSize: '0.875rem' }}>Clique em "+ Novo post" para começar</div>
            </div>
          ) : (
            <div style={{ display: 'grid', gap: '1rem' }}>
              {posts.map(post => (
                <PostCard key={post.id} post={post} onDelete={handleDelete} onViewAsClient={setSimPost} />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── ClientView ───────────────────────────────────────────────────────────────

    function ClientView({ post, isSimulation, onBack, onActionDone }) {
      const [phase,   setPhase]   = useState('review');
      const [comment, setComment] = useState('');
      const [loading, setLoading] = useState(false);
      const [action,  setAction]  = useState(null);

      const handleApprove = async () => {
        if (isSimulation) { setAction('approved'); setPhase('done'); return; }
        setLoading(true);
        try {
          await updatePostStatus(post.id, 'aprovado', null);
          setAction('approved'); setPhase('done'); onActionDone('approved');
        } finally { setLoading(false); }
      };

      const handleSubmitRevision = async () => {
        if (!comment.trim()) return;
        if (isSimulation) { setAction('revision'); setPhase('done'); return; }
        setLoading(true);
        try {
          await updatePostStatus(post.id, 'em_revisao', comment);
          setAction('revision'); setPhase('done'); onActionDone('revision');
        } finally { setLoading(false); }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--color-background-secondary)' }}>

          {isSimulation && (
            <div style={{
              background: 'var(--color-background-tertiary)',
              borderBottom: '1px solid var(--color-border-primary)',
              padding: '0.75rem 1.5rem',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem',
            }}>
              <span style={{ fontSize: '0.875rem', color: 'var(--color-text-secondary)' }}>
                Simulação — esta é exatamente a visão que o cliente verá
              </span>
              <button onClick={onBack} style={smallBtnBack}>Voltar ao painel</button>
            </div>
          )}

          <div style={{ flex: 1, maxWidth: 480, margin: '0 auto', width: '100%', padding: '1rem 1rem 2rem' }}>

            {phase === 'done' ? (
              <div style={{
                background: 'var(--color-background-primary)',
                border: '1px solid var(--color-border-secondary)',
                borderRadius: 'var(--border-radius-xl)',
                padding: '3rem 2rem', textAlign: 'center', marginTop: '2rem',
              }}>
                <div style={{ fontSize: 48, marginBottom: '1rem' }}>
                  {action === 'approved' ? '✅' : '🔁'}
                </div>
                <h2 style={{ fontSize: '1.25rem', fontWeight: 600, marginBottom: '0.75rem' }}>
                  {action === 'approved' ? 'Post aprovado!' : 'Revisão solicitada!'}
                </h2>
                <p style={{ color: 'var(--color-text-secondary)', fontSize: '0.875rem' }}>
                  {action === 'approved'
                    ? 'Obrigado! Sua aprovação foi registrada com sucesso.'
                    : 'Seu comentário foi registrado. Entraremos em contato em breve.'}
                </p>
                {isSimulation && (
                  <button onClick={onBack} style={{ ...btnPrimary, marginTop: '1.5rem' }}>
                    Voltar ao painel
                  </button>
                )}
              </div>
            ) : (
              <div style={{
                background: 'var(--color-background-primary)',
                border: '1px solid var(--color-border-secondary)',
                borderRadius: 'var(--border-radius-xl)',
                overflow: 'hidden', marginTop: '1rem',
              }}>
                {/* Carousel */}
                {post.creativeUrls && post.creativeUrls.length > 0 && (
                  <Carousel urls={post.creativeUrls} />
                )}

                <div style={{ padding: '1.25rem 1.25rem 1.5rem' }}>
                  <h1 style={{ fontSize: '1rem', fontWeight: 700, marginBottom: '1rem' }}>{post.title}</h1>

                  <SectionLabel>Legenda</SectionLabel>
                  <p style={{ fontSize: '0.9375rem', whiteSpace: 'pre-wrap', lineHeight: 1.65, marginBottom: '1.25rem' }}>
                    {post.caption}
                  </p>

                  {post.observation && (
                    <div style={{
                      background: 'var(--color-background-tertiary)',
                      borderRadius: 'var(--border-radius-md)',
                      padding: '0.875rem 1rem', marginBottom: '1.25rem',
                    }}>
                      <SectionLabel>Observação da equipe</SectionLabel>
                      <p style={{ fontSize: '0.875rem', color: 'var(--color-text-secondary)', whiteSpace: 'pre-wrap' }}>
                        {post.observation}
                      </p>
                    </div>
                  )}

                  {phase === 'review' && (
                    <div style={{ display: 'flex', gap: '0.75rem' }}>
                      <button onClick={handleApprove} disabled={loading}
                        style={{ ...btnSuccess, flex: 1, opacity: loading ? 0.6 : 1 }}>
                        {loading ? 'Aguarde…' : 'Aprovar'}
                      </button>
                      <button onClick={() => setPhase('comment')} disabled={loading}
                        style={{ ...btnSecondary, flex: 1 }}>
                        Solicitar ajuste
                      </button>
                    </div>
                  )}

                  {phase === 'comment' && (
                    <div>
                      <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: 500, marginBottom: '0.5rem', color: 'var(--color-text-secondary)' }}>
                        Descreva o ajuste necessário
                      </label>
                      <textarea
                        value={comment}
                        onChange={e => setComment(e.target.value)}
                        placeholder="Ex: Alterar a cor do botão, revisar o texto do segundo parágrafo…"
                        rows={4} autoFocus
                        style={{ ...S.input, resize: 'vertical', marginBottom: '0.75rem' }}
                      />
                      <div style={{ display: 'flex', gap: '0.75rem' }}>
                        <button onClick={() => setPhase('review')} style={{ ...btnSecondary, flex: 1 }}>Voltar</button>
                        <button
                          onClick={handleSubmitRevision}
                          disabled={!comment.trim() || loading}
                          style={{ ...btnPrimary, flex: 1, opacity: (!comment.trim() || loading) ? 0.5 : 1, cursor: (!comment.trim() || loading) ? 'not-allowed' : 'pointer' }}>
                          {loading ? 'Enviando…' : 'Enviar solicitação'}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SectionLabel({ children }) {
      return (
        <div style={{
          fontSize: '0.6875rem', fontWeight: 700,
          textTransform: 'uppercase', letterSpacing: '0.07em',
          color: 'var(--color-text-tertiary)', marginBottom: '0.4rem',
        }}>
          {children}
        </div>
      );
    }

    // ─── ClientViewLoader ─────────────────────────────────────────────────────────

    function ClientViewLoader({ postId }) {
      const [state, setState] = useState('loading');
      const [post,  setPost]  = useState(null);

      useEffect(() => {
        (async () => {
          const found = await loadPost(postId);
          if (!found)                             setState('notfound');
          else if (found.status !== 'aguardando') { setPost(found); setState('already'); }
          else                                    { setPost(found); setState('review');  }
        })();
      }, [postId]);

      if (state === 'loading') return <Centered><span style={{ color: 'var(--color-text-tertiary)' }}>Carregando…</span></Centered>;

      if (state === 'notfound') return (
        <Centered>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 48, marginBottom: '1rem' }}>🔍</div>
            <h2 style={{ fontSize: '1.125rem', fontWeight: 600 }}>Post não encontrado</h2>
            <p style={{ color: 'var(--color-text-secondary)', fontSize: '0.875rem', marginTop: '0.4rem' }}>
              Este link pode ser inválido ou ter expirado.
            </p>
          </div>
        </Centered>
      );

      if (state === 'already') return (
        <Centered>
          <div style={{ textAlign: 'center', maxWidth: 440 }}>
            <div style={{ fontSize: 48, marginBottom: '1rem' }}>
              {post.status === 'aprovado' ? '✅' : '🔁'}
            </div>
            <h2 style={{ fontSize: '1.125rem', fontWeight: 600, marginBottom: '0.75rem' }}>
              Este post já foi revisado
            </h2>
            <p style={{ color: 'var(--color-text-secondary)', fontSize: '0.875rem' }}>
              Este post foi {post.status === 'aprovado' ? 'aprovado' : 'enviado para revisão'} e não pode ser alterado.
            </p>
            {post.clientComment && (
              <div style={{
                background: 'var(--color-background-tertiary)',
                borderRadius: 'var(--border-radius-md)',
                padding: '0.875rem 1rem', marginTop: '1.25rem', textAlign: 'left',
              }}>
                <SectionLabel>Seu comentário</SectionLabel>
                <p style={{ fontSize: '0.875rem', color: 'var(--color-text-secondary)' }}>{post.clientComment}</p>
              </div>
            )}
          </div>
        </Centered>
      );

      return <ClientView post={post} isSimulation={false} onBack={() => {}} onActionDone={() => {}} />;
    }

    function Centered({ children }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', padding: '2rem' }}>
          {children}
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────

    function App() {
      const [posts, setPosts] = useState([]);
      const [route, setRoute] = useState(window.location.hash);
      const [ready, setReady] = useState(false);

      const refresh = async () => {
        const data = await loadPosts();
        setPosts(data);
      };

      useEffect(() => {
        refresh().then(() => setReady(true));
      }, []);

      useEffect(() => {
        const h = () => setRoute(window.location.hash);
        window.addEventListener('hashchange', h);
        return () => window.removeEventListener('hashchange', h);
      }, []);

      if (!ready) return <Centered><span style={{ color: 'var(--color-text-tertiary)' }}>Carregando…</span></Centered>;

      const match = route.match(/^#review\/(.+)$/);
      if (match) return <ClientViewLoader postId={match[1]} />;

      return <AdminPanel posts={posts} onRefresh={refresh} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
